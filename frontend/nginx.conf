server {
    listen 80;
    root /usr/share/nginx/html;

    # Resolve "backend" a cada 10s: recriar só o backend não deixa o nginx com IP velho (502).
    resolver 127.0.0.11 valid=10s;
    set $backend http://backend:8000;

    location /api/ {
        proxy_pass $backend;
        proxy_http_version 1.1;
        # $http_host, nao $host: $host perde a porta, e o middleware `fronteira` do backend
        # compara Origin (localhost:7001) com Host. Com a porta cortada, todo POST da
        # interface virava 403 "Origem nao autorizada".
        proxy_set_header Host $http_host;
        # SSE: sem buffer, sem timeout curto (modelo local pode pensar por minutos)
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 1h;
        proxy_send_timeout 1h;
    }

    location / {
        try_files $uri /index.html;
    }
}

# Roda o que dá para rodar sem subir o compose: os testes do backend, os do forja-runner (que é um
# processo do host, testado com um servidor HTTP de verdade em porta livre) e o typecheck/lint da
# interface. Subir o docker-compose inteiro no runner não pagaria o tempo.
name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - run: pip install -r requirements.txt
        working-directory: backend
      - run: python -m pytest -q
        working-directory: backend

  runner:
    # O runner roda no PC do usuário, que é quase sempre Windows: é lá que o PowerShell, o taskkill
    # e o caminho com letra de disco se comportam como em produção.
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install pytest
      - run: python -m pytest tools -q

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
        working-directory: frontend
      - run: npm run typecheck
        working-directory: frontend
      - run: npm run lint
        working-directory: frontend
      - run: npm run build
        working-directory: frontend

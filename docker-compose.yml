name: forja

services:
  backend:
    build: ./backend
    restart: unless-stopped
    init: true  # colhe zumbis do Chromium e dos dev servers (setsid nohup) reparentados ao PID 1
    environment:
      WORKSPACE_ROOT: /workspace
      WORKSPACE_HOST: ${WORKSPACE_PATH}
      # Discos do Windows visíveis no seletor de pasta. Para outro disco, some aqui e em volumes (ex.: D=/host/d).
      HOST_MOUNTS: ${HOST_MOUNTS:-C=/host/c}
      FORJA_PICKER_URL: ${FORJA_PICKER_URL:-http://127.0.0.1:3001}
      # forja-runner (comandos e servidores no seu sistema); o token fica em config/runner-token (montado em /config)
      FORJA_RUNNER_URL: ${FORJA_RUNNER_URL:-http://host.docker.internal:3002}
      DB_PATH: /data/forja.db
      OLLAMA_URL: ${OLLAMA_URL:-http://host.docker.internal:11434/v1}
      LMSTUDIO_URL: ${LMSTUDIO_URL:-http://host.docker.internal:1234/v1}
      NUM_CTX: ${NUM_CTX:-32768}
      MAX_ITERATIONS: ${MAX_ITERATIONS:-25}
      MAX_FILE_BYTES: ${MAX_FILE_BYTES:-1000000}
      SHELL_TIMEOUT_MAX: ${SHELL_TIMEOUT_MAX:-300}
      COMPACT_AT: ${COMPACT_AT:-0.8}
      SEARXNG_URL: http://searxng:8080
      MCP_CONFIG: /config/mcp.json
    volumes:
      - forja-data:/data
      - ${WORKSPACE_PATH:?defina WORKSPACE_PATH no .env}:/workspace
      # Como no Claude Desktop: qualquer pasta pode virar pasta de trabalho. As ferramentas de arquivo
      # ficam presas à pasta escolhida; o shell (sempre com aprovação) enxerga o disco inteiro.
      - ${HOST_DRIVE_C:-C:/}:/host/c
      - ./config:/config
    extra_hosts:
      - "host.docker.internal:host-gateway"

  searxng:
    image: searxng/searxng:latest
    restart: unless-stopped
    volumes:
      - ./searxng/settings.yml:/etc/searxng/settings.yml:ro
    environment:
      SEARXNG_BASE_URL: http://searxng:8080/

  frontend:
    build: ./frontend
    restart: unless-stopped
    depends_on: [backend]
    ports:
      - "${FORJA_PORT:-3000}:80"

volumes:
  forja-data:
